name: MACD Histogram Scan

on:
  schedule:
    - cron: "3 0,4,8,12,16,20 * * *"   # 3 minutes after each 4h candle closes (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run histogram scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
          SYMBOLS: ${{ vars.SYMBOLS }}
        run: python macd_histogram_bot.py

      - name: Persist state
        run: |
          git config user.name "macd-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_histogram.json
          git diff --quiet --cached || git commit -m "update histogram state [skip ci]"
          git push
